<button type="button" class="flex cursor-pointer items-center gap-5">
  <span class="text-[32px] leading-normal font-bold whitespace-nowrap text-black">{{
    name()
  }}</span>
  <span class="relative block size-17.5 shrink-0">
    <img class="size-full rounded-full bg-white object-cover" [src]="avatar()" alt="" />
    <img class="absolute right-0 bottom-0 size-4.25" src="/icons/online.svg" alt="Online" />
  </span>
  <img class="size-7.5 shrink-0" src="/icons/keyboard-arrow-down.svg" alt="" />
</button>
