<div class="relative">
  <button
    type="button"
    class="group flex cursor-pointer items-center gap-5"
    aria-haspopup="menu"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <span
      class="text-[32px] leading-normal font-bold whitespace-nowrap text-black group-hover:text-purple-2"
      >{{ name() }}</span
    >
    <span class="relative block size-17.5 shrink-0">
      <img class="size-full rounded-full bg-white object-cover" [src]="avatar()" alt="" />
      <img class="absolute right-0 bottom-0 size-4.25" src="/icons/online.svg" alt="Online" />
    </span>
    <span class="relative size-7.5 shrink-0">
      <img
        class="absolute inset-0 size-full group-hover:opacity-0"
        src="/icons/keyboard-arrow-down.svg"
        alt=""
      />
      <img
        class="absolute inset-0 size-full opacity-0 group-hover:opacity-100"
        src="/icons/expand-more-hover.svg"
        alt=""
      />
    </span>
  </button>

  @if (open()) {
    <div
      role="menu"
      class="absolute top-full right-0 z-20 mt-2.5 flex flex-col gap-3.75 rounded-tl-[30px] rounded-br-[30px] rounded-bl-[30px] bg-white p-7.5 shadow-menu"
    >
      <button
        type="button"
        role="menuitem"
        class="w-55.5 cursor-pointer rounded-[100px] px-17.5 py-2.5 text-2xl font-semibold whitespace-nowrap text-black hover:bg-bg hover:font-bold hover:text-purple-3"
        (click)="close()"
      >
        Profil
      </button>
      <button
        type="button"
        role="menuitem"
        class="w-55.5 cursor-pointer rounded-[100px] px-11.25 py-2.5 text-2xl font-semibold whitespace-nowrap text-black hover:bg-bg hover:font-bold hover:text-purple-3"
        (click)="logOut()"
      >
        Log out
      </button>
    </div>
  }
</div>
