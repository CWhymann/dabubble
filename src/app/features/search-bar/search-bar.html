<div class="relative">
  <label
    class="flex h-17.5 cursor-text items-center justify-between gap-4 rounded-[42px] bg-white px-5 xl:px-11.25"
  >
    <input
      type="search"
      class="min-w-0 flex-1 bg-transparent text-xl text-black xl:text-2xl outline-hidden placeholder:text-text-gray"
      placeholder="Devspace durchsuchen"
      aria-label="Devspace durchsuchen"
      autocomplete="off"
      [value]="query()"
      (input)="onInput($event)"
    />
    <img class="size-8.75 shrink-0" src="/icons/search.svg" alt="" />
  </label>

  @if (query().trim()) {
    <div
      class="absolute top-full right-0 left-0 z-30 mt-2 rounded-[20px] border border-light-purple bg-white p-3 shadow-menu"
    >
      <app-search-results [query]="query()" [channels]="channels()" (pick)="select($event)" />
    </div>
  }
</div>
