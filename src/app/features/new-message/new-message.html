<div
  class="fixed inset-0 z-40 flex flex-col overflow-y-auto bg-white lg:inset-auto lg:top-1/2 lg:left-1/2 lg:w-136 lg:-translate-x-1/2 lg:-translate-y-1/2 lg:rounded-[30px] lg:shadow-menu"
  role="dialog"
  aria-modal="true"
  aria-labelledby="new-message-title"
>
  <header
    class="flex items-center justify-between bg-white px-4 pt-10 pb-2.5 shadow-dropdown lg:px-8 lg:pt-8 lg:shadow-none"
  >
    <div class="flex items-center gap-3">
      <button
        type="button"
        class="flex size-10 cursor-pointer items-center justify-center rounded-[20px] hover:bg-bg lg:hidden"
        aria-label="Zurück"
        (click)="closed.emit()"
      >
        <img class="size-6 rotate-90" src="/icons/keyboard-arrow-down.svg" alt="" />
      </button>
      <h2 id="new-message-title" class="text-xl font-bold text-black lg:text-2xl">
        Neue Nachricht
      </h2>
    </div>
    <button
      type="button"
      class="hidden size-10 cursor-pointer items-center justify-center rounded-[20px] hover:bg-bg lg:flex"
      aria-label="Dialog schließen"
      (click)="closed.emit()"
    >
      <img class="size-6" src="/icons/close.svg" alt="" />
    </button>
  </header>

  <div class="flex flex-col gap-6 p-4 lg:px-8 lg:pb-8">
    <label
      class="flex items-center rounded-[30px] border border-light-purple px-5 focus-within:border-purple-1 hover:not-focus-within:border-purple-2"
    >
      <span class="sr-only">An</span>
      <input
        type="search"
        class="min-w-0 flex-1 bg-transparent py-3.5 text-lg text-black outline-hidden placeholder:text-text-gray"
        placeholder="An: #channel, oder @jemand"
        autocomplete="off"
        [value]="query()"
        (input)="onQuery($event)"
      />
    </label>

    @if (query().trim()) {
      <app-search-results [query]="query()" [channels]="channels()" (pick)="picked.emit($event)" />
    } @else {
      <p class="text-lg text-text-gray">
        Wähle einen Channel oder eine Person, um die Unterhaltung zu öffnen.
      </p>
    }
  </div>
</div>
