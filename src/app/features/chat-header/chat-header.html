<div class="flex w-full items-center justify-between gap-2.5">
  <button
    type="button"
    class="flex min-w-0 cursor-pointer items-center gap-1.25 rounded-[100px] py-0.5 text-xl font-bold hover:bg-bg hover:text-purple-3 lg:max-w-69.5 lg:gap-2.5 lg:px-1 2xl:px-2.5 lg:py-1.5 lg:text-2xl"
    aria-label="Channel bearbeiten"
    (click)="editChannel.emit()"
  >
    <img class="size-6 shrink-0" src="/icons/tag-dark.svg" alt="" />
    <span class="min-w-0 truncate">{{ channelName() }}</span>
    <span class="flex shrink-0 items-center lg:px-1 2xl:px-2">
      <img src="/icons/chevron-down.svg" alt="" />
    </span>
  </button>

  <div class="flex shrink-0 items-center gap-2.5">
    <button
      type="button"
      class="hidden h-11.5 cursor-pointer items-center gap-2.5 rounded-[30px] px-2.5 py-0.75 hover:bg-bg hover:text-purple-3 lg:flex"
      [attr.aria-label]="members().length + ' Mitglieder anzeigen'"
    >
      <span class="flex -space-x-2.5">
        @for (avatar of avatars(); track avatar) {
          <img
            class="size-10 rounded-full border-2 border-white bg-white object-cover"
            [src]="avatar"
            alt=""
          />
        }
      </span>
      <span class="text-xl font-semibold">{{ members().length }}</span>
    </button>
    <button
      type="button"
      class="cursor-pointer rounded-[20px] bg-bg p-2"
      aria-label="Mitglieder hinzufügen"
      (click)="addMembers.emit()"
    >
      <img class="size-4.5 lg:size-6" src="/icons/person-add.svg" alt="" />
    </button>
  </div>
</div>
