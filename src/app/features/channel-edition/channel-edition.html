<div
  class="fixed inset-0 z-40 flex flex-col overflow-y-auto bg-white lg:inset-auto lg:top-26 lg:right-5 lg:bottom-5 lg:w-125 lg:rounded-[30px] lg:shadow-menu"
  role="dialog"
  aria-modal="true"
  aria-labelledby="channel-edition-title"
>
  <header
    class="flex items-center justify-between bg-white px-4 pt-10 pb-2.5 shadow-dropdown lg:rounded-t-[30px] lg:px-6 lg:pt-6 lg:shadow-header"
  >
    <div class="flex items-center gap-1.5">
      <img class="size-6" src="/icons/tag-dark.svg" alt="" />
      <h2 id="channel-edition-title" class="text-xl font-bold text-black">{{ channel() }}</h2>
    </div>
    <button
      type="button"
      class="flex size-10 cursor-pointer items-center justify-center rounded-[20px] hover:bg-bg"
      aria-label="Channel-Bearbeitung schließen"
      (click)="closed.emit()"
    >
      <img class="size-6" src="/icons/close.svg" alt="" />
    </button>
  </header>

  <div class="flex flex-col gap-6 p-4 lg:p-6">
    <section class="flex flex-col gap-5 rounded-[20px] border border-light-purple p-5">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold text-black">Channel-Name</h3>
        <button
          type="button"
          class="flex size-10 cursor-pointer items-center justify-center rounded-[40px] bg-bg p-0.75"
          [attr.aria-label]="editingName() ? 'Channel-Name speichern' : 'Channel-Name bearbeiten'"
          (click)="toggleName()"
        >
          <img
            class="size-6"
            [src]="editingName() ? '/icons/check-circle.svg' : '/icons/edit.svg'"
            alt=""
          />
        </button>
      </div>
      @if (editingName()) {
        <input
          type="text"
          class="w-full rounded-[30px] border border-light-purple px-5 py-3.75 text-lg text-black outline-hidden hover:border-purple-2 focus:border-purple-1"
          maxlength="28"
          aria-label="Channel-Name"
          autocomplete="off"
          [value]="nameDraft()"
          (input)="onNameInput($event)"
        />
      } @else {
        <p class="flex items-center gap-2.5 text-lg text-black">
          <img class="size-6" src="/icons/tag.svg" alt="" />
          {{ channel() }}
        </p>
      }
    </section>

    <section class="flex flex-col gap-5 rounded-[20px] border border-light-purple p-5">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold text-black">Beschreibung</h3>
        <button
          type="button"
          class="flex size-10 cursor-pointer items-center justify-center rounded-[40px] bg-bg p-0.75"
          [attr.aria-label]="
            editingDescription() ? 'Beschreibung speichern' : 'Beschreibung bearbeiten'
          "
          (click)="toggleDescription()"
        >
          <img
            class="size-6"
            [src]="editingDescription() ? '/icons/check-circle.svg' : '/icons/edit.svg'"
            alt=""
          />
        </button>
      </div>
      @if (editingDescription()) {
        <textarea
          rows="4"
          class="w-full resize-none rounded-[20px] border border-light-purple px-5 py-3.75 text-lg text-black outline-hidden hover:border-purple-2 focus:border-purple-1"
          aria-label="Beschreibung"
          [value]="descriptionDraft()"
          (input)="onDescriptionInput($event)"
        ></textarea>
      } @else {
        <p class="text-lg text-black">{{ description() }}</p>
      }
      <div class="border-t border-light-purple"></div>
      <div class="flex flex-col gap-2.5">
        <h3 class="text-lg font-bold text-black">Erstellt von</h3>
        <p class="text-xl text-purple-3">{{ creator() }}</p>
      </div>
    </section>

    <section class="flex flex-col gap-5 rounded-[20px] border border-light-purple p-5">
      <h3 class="text-2xl font-bold text-black">Mitglieder</h3>
      <ul class="flex flex-col gap-2">
        @for (user of members(); track user.name) {
          <li>
            <button
              type="button"
              class="flex w-full cursor-pointer items-center gap-4 rounded-[30px] px-2 py-1 text-left text-lg text-black hover:bg-bg"
              (click)="showProfile.emit(user.name)"
            >
              <span class="relative block size-12.5 shrink-0">
                <img
                  class="size-full rounded-full bg-white object-cover"
                  [src]="user.avatar"
                  alt=""
                />
                <img
                  class="absolute right-0 bottom-0 size-3.5"
                  [src]="user.online ? '/icons/online-small.svg' : '/icons/offline-small.svg'"
                  [alt]="user.online ? 'Online' : 'Offline'"
                />
              </span>
              <span class="min-w-0 truncate">{{ label(user) }}</span>
            </button>
          </li>
        }
      </ul>
    </section>
  </div>
</div>
