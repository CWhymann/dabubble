@if (hits().length === 0) {
  <p class="text-lg text-text-gray">Keine Treffer.</p>
} @else {
  <ul class="flex flex-col gap-3.25">
    @for (hit of hits(); track $index) {
      <li>
        <button
          type="button"
          class="flex w-full cursor-pointer items-center gap-3.75 rounded-[35px] px-5 py-1 text-left text-lg text-black hover:bg-bg"
          (click)="pick.emit(hit)"
        >
          @if (hit.kind === 'channel') {
            <img class="size-6 shrink-0" src="/icons/tag.svg" alt="" />
            <span class="min-w-0 truncate">{{ hit.name }}</span>
          } @else {
            <span class="relative block size-12.5 shrink-0">
              <img
                class="size-full rounded-full bg-white object-cover"
                [src]="hit.user.avatar"
                alt=""
              />
              <img
                class="absolute right-0 bottom-0 size-3.5"
                [src]="hit.user.online ? '/icons/online-small.svg' : '/icons/offline-small.svg'"
                [alt]="hit.user.online ? 'Online' : 'Offline'"
              />
            </span>
            <span class="min-w-0 truncate">{{ label(hit.user) }}</span>
          }
        </button>
      </li>
    }
  </ul>
}
