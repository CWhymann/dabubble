<div class="flex flex-col gap-2">
  @if (root(); as root) {
    <app-chat-message
      [message]="root"
      [compact]="true"
      [canReply]="false"
      (showProfile)="showProfile.emit($event)"
    />

    <div class="mx-5.5 flex items-center gap-5 lg:mr-8 lg:ml-8.25">
      <span class="text-lg text-light-purple">
        {{ replies().length }} {{ replies().length === 1 ? 'Antwort' : 'Antworten' }}
      </span>
      <div class="flex-1 border-t border-light-purple"></div>
    </div>

    @for (reply of replies(); track reply.id) {
      <app-chat-message
        [message]="reply"
        [compact]="true"
        [canReply]="false"
        (showProfile)="showProfile.emit($event)"
      />
    }
  }
</div>
