<div class="flex flex-col gap-2.5 thread:gap-2">
  <app-chat-message [message]="root" [compact]="true" (showProfile)="showProfile.emit($event)" />

  <div class="mx-5 flex items-center gap-5 thread:mr-8 thread:ml-8.25">
    <span class="text-lg text-light-purple">
      {{ replies.length }} {{ replies.length === 1 ? 'Antwort' : 'Antworten' }}
    </span>
    <div class="flex-1 border-t border-light-purple"></div>
  </div>

  @for (reply of replies; track $index) {
    <app-chat-message [message]="reply" [compact]="true" (showProfile)="showProfile.emit($event)" />
  }
</div>
