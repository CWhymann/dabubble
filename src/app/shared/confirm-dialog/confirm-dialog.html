<div class="fixed inset-0 z-60 bg-black/20" aria-hidden="true" (click)="cancelled.emit()"></div>

<section
  role="dialog"
  aria-modal="true"
  aria-labelledby="confirm-dialog-title"
  class="fixed top-1/2 left-1/2 z-60 flex w-[min(434px,calc(100vw-2rem))] -translate-x-1/2 -translate-y-1/2 flex-col gap-6 rounded-[30px] bg-white p-5 shadow-menu lg:p-8"
>
  <h2 id="confirm-dialog-title" class="text-2xl font-bold text-black">{{ title() }}</h2>
  <p class="text-lg text-text-gray">{{ message() }}</p>
  <div class="flex justify-end gap-4">
    <app-button-secondary (click)="cancelled.emit()">Abbrechen</app-button-secondary>
    <app-button-primary (click)="confirmed.emit()">{{ confirmLabel() }}</app-button-primary>
  </div>
</section>
