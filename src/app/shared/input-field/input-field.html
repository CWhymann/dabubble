<label
  class="flex w-full items-center gap-4 rounded-full bg-bg px-4 py-4.5 hover:ring-1 hover:ring-black focus-within:ring-2 focus-within:ring-purple-2 sm:gap-7.5 sm:px-8"
>
  <img class="size-6 shrink-0" [src]="icon()" alt="" />
  <input
    class="min-w-0 flex-1 bg-transparent text-lg leading-[1.2] font-medium text-black outline-hidden placeholder:text-text-gray"
    [type]="type()"
    [name]="name()"
    [placeholder]="placeholder()"
    [attr.aria-label]="label()"
  />
</label>
