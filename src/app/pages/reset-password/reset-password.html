<app-auth-layout>
  <form
    class="relative flex h-auto w-full max-w-173 flex-col items-center gap-8 rounded-[30px] bg-white px-5 py-8 shadow-header lg:h-105.75 lg:w-173 lg:max-w-none lg:gap-10 lg:px-22.5 lg:py-10"
    [formGroup]="form"
    (ngSubmit)="submit()"
    novalidate
  >
    <button
      class="absolute top-5 left-5 flex size-10 cursor-pointer items-center justify-center lg:top-11.25 lg:left-8"
      type="button"
      aria-label="Zurück"
      (click)="goBack()"
    >
      <img src="/icons/13.%20go_back.svg" alt="" />
    </button>

    <h1
      class="pt-7 text-center text-2xl leading-[1.2] font-bold text-purple-1 sm:text-[40px] lg:pt-0 lg:text-5xl"
    >
      Passwort zurücksetzen
    </h1>

    <div class="flex h-auto w-full max-w-100 flex-col lg:h-61.25 lg:max-w-none">
      <input
        class="h-14.5 w-full rounded-[100px] bg-bg px-10 py-4.5 text-lg leading-[1.2] font-medium text-text-gray outline-hidden placeholder:text-text-gray focus:ring-2 focus:ring-purple-2"
        formControlName="password"
        type="password"
        name="password"
        autocomplete="new-password"
        placeholder="Neues Passwort"
        aria-label="Neues Passwort"
        [attr.aria-invalid]="passwordError() ? true : null"
      />

      @if (passwordError()) {
        <p class="mt-1.5 text-sm leading-[1.2] text-error">
          {{ passwordError() }}
        </p>
      }

      <div class="relative mt-5 lg:mt-10">
        <input
          class="h-14.5 w-full rounded-[100px] bg-bg px-10 py-4.5 text-lg leading-[1.2] font-medium text-text-gray outline-hidden placeholder:text-text-gray focus:ring-2 focus:ring-purple-2"
          formControlName="confirmPassword"
          type="password"
          name="confirmPassword"
          autocomplete="new-password"
          placeholder="Neues Kennwort bestätigen"
          aria-label="Neues Kennwort bestätigen"
          [attr.aria-invalid]="confirmPasswordError() ? true : null"
        />

        @if (confirmPasswordError()) {
          <p class="absolute top-16 left-0 w-full text-sm leading-[1.2] text-error">
            {{ confirmPasswordError() }}
          </p>
        }
      </div>

      <div class="mt-5 flex justify-end lg:mt-10">
        <button
          class="flex min-h-12.25 w-47 cursor-pointer items-center justify-center rounded-[25px] bg-text-gray px-6.25 py-3 text-lg leading-[normal] font-normal text-white transition-colors hover:bg-purple-1 disabled:cursor-not-allowed disabled:opacity-50"
          type="submit"
          [disabled]="form.invalid"
        >
          Passwort ändern
        </button>
      </div>
    </div>

    @if (submitError()) {
      <p class="text-center text-sm leading-[1.2] text-error">
        {{ submitError() }}
      </p>
    }
  </form>
</app-auth-layout>
