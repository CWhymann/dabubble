<app-auth-layout>
  <form
    class="relative flex w-full max-w-151.5 flex-col items-center gap-7.5 rounded-[30px] bg-white px-5 py-8.75 shadow-header lg:min-h-167.25 lg:gap-10 lg:px-13.25 lg:py-10"
    [formGroup]="form"
    novalidate
  >
    <button
      class="absolute top-2 left-2 flex size-10 cursor-pointer items-center justify-center lg:top-11.25 lg:left-8"
      type="button"
      aria-label="Zurück"
      (click)="goBack()"
    >
      <img src="/icons/13.%20go_back.svg" alt="" />
    </button>

    <div class="flex flex-col items-center gap-3.75 pt-8 text-center lg:gap-7.5 lg:pt-0">
      <h1 class="text-[32px] leading-[1.2] font-bold text-purple-1 lg:text-display">
        Konto erstellen
      </h1>
      <p class="max-w-121.5 text-[17px] leading-[1.2] text-black lg:text-xl">
        Mit deinem Namen und deiner E-Mail-Adresse hast du dein neues DABubble-Konto.
      </p>
    </div>

    <div class="flex w-full flex-col items-center gap-7.5 lg:gap-8">
      <div class="flex w-full flex-col items-center gap-7.5 lg:gap-10">
        <app-input-field
          formControlName="name"
          icon="/icons/person_filled.svg"
          label="Name und Nachname"
          type="text"
          name="name"
          autocomplete="name"
          placeholder="Name und Nachname"
        />
        <app-input-field
          formControlName="email"
          icon="/icons/mail.svg"
          label="E-Mail"
          type="email"
          name="email"
          autocomplete="email"
          placeholder="beispielname@email.com"
          [error]="emailError()"
        />
        <app-input-field
          formControlName="password"
          icon="/icons/lock.svg"
          label="Passwort"
          type="password"
          name="password"
          autocomplete="new-password"
          placeholder="Passwort"
          [error]="passwordError()"
        />
      </div>

      <div class="flex w-full max-w-125 flex-wrap items-center gap-2">
        <input
          class="size-6 shrink-0 cursor-pointer accent-purple-1"
          type="checkbox"
          formControlName="privacy"
          aria-label="Der Datenschutzerklärung zustimmen"
        />
        <span class="font-open-sans text-base leading-[1.2] text-menu">Ich stimme der</span>
        <button
          class="-mx-1 cursor-pointer rounded-[30px] px-1 py-1.25 font-figtree text-lg leading-[1.2] whitespace-nowrap text-purple-2 transition-colors duration-100 ease-in hover:bg-bg hover:text-purple-1"
          type="button"
        >
          Datenschutzerklärung
        </button>
        <span class="-ml-1 font-open-sans text-base leading-[1.2] text-menu">zu.</span>
      </div>
    </div>

    <div class="flex w-full max-w-125 justify-end">
      <app-button-primary type="submit" [disabled]="form.invalid">Weiter</app-button-primary>
    </div>
  </form>
</app-auth-layout>
