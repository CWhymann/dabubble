<app-auth-layout>
  <form
    class="flex w-full max-w-151.5 flex-col items-center gap-5 rounded-[30px] bg-white px-5 py-8.75 shadow-header lg:min-h-192.25 lg:gap-10 lg:px-13.25 lg:py-12.5"
    [formGroup]="form"
    novalidate
  >
    <div class="flex flex-col items-center gap-3.75 text-center lg:gap-7.5">
      <h1 class="text-[32px] leading-[1.2] font-bold text-purple-1 lg:text-display">Anmeldung</h1>
      <p class="max-w-121.5 text-[17px] leading-[1.2] text-black lg:text-xl">
        Wir empfehlen dir, die E-Mail-Adresse zu nutzen, die du bei der Arbeit verwendest.
      </p>
    </div>

    <div class="flex w-full flex-col items-center gap-7.5 lg:gap-10">
      <app-input-field
        formControlName="email"
        icon="/icons/mail.svg"
        label="E-Mail"
        type="email"
        name="email"
        autocomplete="email"
        placeholder="beispielname@email.com"
        [error]="emailError()"
      />
      <app-input-field
        formControlName="password"
        icon="/icons/lock.svg"
        label="Passwort"
        type="password"
        name="password"
        autocomplete="current-password"
        placeholder="Passwort"
        [error]="passwordError()"
      />
    </div>

    <app-forgot-password-link />
    <app-or-divider />
    <app-button-google />

    <div class="flex flex-wrap justify-center gap-5 lg:gap-7.5">
      <app-button-primary type="submit" [disabled]="form.invalid">Anmelden</app-button-primary>
      <app-button-secondary>Gäste-Login</app-button-secondary>
    </div>
  </form>

  <div
    class="flex flex-col items-center gap-5 lg:absolute lg:top-18.75 lg:right-18.75 lg:items-end lg:gap-2.5"
  >
    <p class="text-lg text-black">Neu bei DABubble?</p>
    <app-button-secondary class="lg:hidden" [compact]="true">Konto erstellen</app-button-secondary>
    <app-text-link class="hidden lg:block">Konto erstellen</app-text-link>
  </div>
</app-auth-layout>
