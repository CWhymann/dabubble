name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Icon-Pfade in Quellcode und Templates relativ machen
        run: |
          find src -type f \( -name "*.ts" -o -name "*.html" \) \
            -exec sed -i 's#/icons/#icons/#g' {} +
      - run: npx ng build --configuration production --base-href /dabubble/
      - name: Schrift- und Icon-Pfade in CSS an den Unterordner anpassen
        run: |
          find dist/dabubble/browser -type f -name "*.css" \
            -exec sed -i 's#/fonts/#/dabubble/fonts/#g; s#/icons/#/dabubble/icons/#g' {} +
      - name: Fallback für direkte Aufrufe wie /home
        run: cp dist/dabubble/browser/index.html dist/dabubble/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/dabubble/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
